<svg xmlns="http://www.w3.org/2000/svg" width="8.5in" height="11in" viewBox="0 0 612 792">
<title>Zotero + IA: del hallazgo a la cita</title>
<desc>Ficha de siete casos de uso del rol bibliotecario, con encargos y comprobaciones.</desc>
<rect x="0" y="0" width="612" height="792" rx="0" fill="#F7F6F0"/>
<rect x="0" y="0" width="612" height="106" rx="0" fill="#183D3A"/>
<g transform="translate(484 9) scale(0.171875)">
  <title>Seminario IIE-3T: probabilidad, sociedad y ecosistema</title>
  <desc>Propuesta de identificador: tres nodos enlazados, con una distribución de probabilidad, dos personas y una hoja. Los enlaces son simbólicos, no arcos causales del modelo.</desc>
  <rect width="512" height="512" rx="112" fill="#183D3A"/>
  <g fill="none" stroke="#86AAA0" stroke-width="13" stroke-linecap="round">
    <path d="M211 229 L166 301 M301 229 L346 301 M216 354 H296"/>
  </g>
  <!-- Distribución: incertidumbre y razonamiento probabilístico. -->
  <circle cx="256" cy="160" r="91" fill="#DFAD67"/>
  <path d="M196 186 C221 186 222 129 247 129 C273 129 270 176 290 181 C299 184 307 185 316 186 L316 196 H196 Z" fill="#183D3A"/>
  <path d="M247 117 V204" fill="none" stroke="#FFF6E6" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 11"/>
  <!-- Comunidad: dos personas, no un individuo aislado. -->
  <circle cx="146" cy="354" r="72" fill="#9DC8D5"/>
  <g fill="#183D3A">
    <circle cx="128" cy="337" r="13"/>
    <circle cx="165" cy="337" r="13"/>
    <path d="M105 384 V368 C105 347 151 347 151 368 V384 Z"/>
    <path d="M143 384 V368 C143 347 188 347 188 368 V384 Z"/>
  </g>
  <path d="M146 366 V384" stroke="#9DC8D5" stroke-width="6"/>
  <!-- Hoja: referencia al mundo vivo, no definición del ecosistema. -->
  <circle cx="366" cy="354" r="72" fill="#C4D6AC"/>
  <path d="M340 378 C324 340 350 322 396 322 C398 363 378 389 340 378 Z" fill="#183D3A"/>
  <path d="M338 386 L379 343 M354 369 L354 351 M363 360 L380 360" fill="none" stroke="#C4D6AC" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<text x="30" y="25" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="700" fill="#B7DCD2">SEMINARIO IIE-3T  /  GUÍA DE BOLSILLO</text>
<text x="30" y="58" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#FFFFFF">Zotero + IA</text>
<text x="30" y="81" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#FFFFFF">Del hallazgo a la cita</text>
<text x="30" y="97" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="400" fill="#DCECE6">Siete tareas para trabajar con tu bibliotecario científico.</text>
<text x="30" y="128" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="700" fill="#167A71">UN ENCARGO QUE PUEDES ADAPTAR</text>
<text x="30" y="146" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#183D3A">Actúa como bibliotecario. En [biblioteca y colección], realiza [tarea] con [fuentes] y entrega [producto].</text>
<text x="30" y="161" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#183D3A">Comprueba tu acceso, declara qué consultaste y verifica los cambios guardados. Si hay ambigüedad, indícala.</text>
<text x="30" y="199" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="700" fill="#167A71">ELIGE UNA TAREA · REVISA SU RESULTADO</text>
<rect x="30" y="211" width="268" height="109" rx="7" fill="#FFFFFF"/>
<rect x="42" y="223" width="23" height="23" rx="5" fill="#167A71"/>
<text x="48" y="239" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">1</text>
<text x="74" y="238" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#183D3A">Encontrar y registrar</text>
<text x="42" y="260" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="400" fill="#183D3A">Busca sobre [pregunta]; coteja e incorpora las fuentes</text>
<text x="42" y="272" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="400" fill="#183D3A">seleccionadas, sin duplicados.</text>
<text x="42" y="288" font-family="Arial, Helvetica, sans-serif" font-size="9.4" font-weight="400" fill="#4B625F">Comprueba: Obra, versión y colección correctas. La</text>
<text x="42" y="299.5" font-family="Arial, Helvetica, sans-serif" font-size="9.4" font-weight="400" fill="#4B625F">búsqueda externa precede al registro.</text>
<rect x="314" y="211" width="268" height="109" rx="7" fill="#FFFFFF"/>
<rect x="326" y="223" width="23" height="23" rx="5" fill="#167A71"/>
<text x="332" y="239" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">2</text>
<text x="358" y="238" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#183D3A">Organizar y etiquetar</text>
<text x="326" y="260" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="400" fill="#183D3A">Propón etiquetas de tema y estado; aplica las</text>
<text x="326" y="272" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="400" fill="#183D3A">acordadas.</text>
<text x="326" y="288" font-family="Arial, Helvetica, sans-serif" font-size="9.4" font-weight="400" fill="#4B625F">Comprueba: Criterios consistentes. Metadatos verificados</text>
<text x="326" y="299.5" font-family="Arial, Helvetica, sans-serif" font-size="9.4" font-weight="400" fill="#4B625F">no significa texto leído.</text>
<rect x="30" y="325" width="268" height="109" rx="7" fill="#FFFFFF"/>
<rect x="42" y="337" width="23" height="23" rx="5" fill="#167A71"/>
<text x="48" y="353" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">3</text>
<text x="74" y="352" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#183D3A">Leer y anotar</text>
<text x="42" y="374" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="400" fill="#183D3A">Recupera mis comentarios y resalta [pasaje] en [PDF]</text>
<text x="42" y="386" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="400" fill="#183D3A">con [color].</text>
<text x="42" y="402" font-family="Arial, Helvetica, sans-serif" font-size="9.4" font-weight="400" fill="#4B625F">Comprueba: Texto y página exactos; anotación visible en</text>
<text x="42" y="413.5" font-family="Arial, Helvetica, sans-serif" font-size="9.4" font-weight="400" fill="#4B625F">el lector tras sincronizar.</text>
<rect x="314" y="325" width="268" height="109" rx="7" fill="#FFFFFF"/>
<rect x="326" y="337" width="23" height="23" rx="5" fill="#167A71"/>
<text x="332" y="353" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">4</text>
<text x="358" y="352" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#183D3A">Sintetizar fuentes</text>
<text x="326" y="374" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="400" fill="#183D3A">Compara estas obras sobre [pregunta]: argumentos,</text>
<text x="326" y="386" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="400" fill="#183D3A">métodos y límites.</text>
<text x="326" y="402" font-family="Arial, Helvetica, sans-serif" font-size="9.4" font-weight="400" fill="#4B625F">Comprueba: Cada afirmación tiene fuente. Distingue</text>
<text x="326" y="413.5" font-family="Arial, Helvetica, sans-serif" font-size="9.4" font-weight="400" fill="#4B625F">resumen consultado y texto completo.</text>
<rect x="30" y="439" width="268" height="109" rx="7" fill="#FFFFFF"/>
<rect x="42" y="451" width="23" height="23" rx="5" fill="#167A71"/>
<text x="48" y="467" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">5</text>
<text x="74" y="466" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#183D3A">Citar al escribir</text>
<text x="42" y="488" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="400" fill="#183D3A">Propón fuentes consultadas que sustenten [párrafo] e</text>
<text x="42" y="500" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="400" fill="#183D3A">incorpora las citas.</text>
<text x="42" y="516" font-family="Arial, Helvetica, sans-serif" font-size="9.4" font-weight="400" fill="#4B625F">Comprueba: Respaldo del pasaje y localización. Clave</text>
<text x="42" y="527.5" font-family="Arial, Helvetica, sans-serif" font-size="9.4" font-weight="400" fill="#4B625F">Zotero y clave de cita son distintas.</text>
<rect x="314" y="439" width="268" height="109" rx="7" fill="#FFFFFF"/>
<rect x="326" y="451" width="23" height="23" rx="5" fill="#167A71"/>
<text x="332" y="467" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">6</text>
<text x="358" y="466" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#183D3A">Generar bibliografías</text>
<text x="326" y="488" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="400" fill="#183D3A">Genera la bibliografía de [documento] en [estilo o</text>
<text x="326" y="500" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="400" fill="#183D3A">formato].</text>
<text x="326" y="516" font-family="Arial, Helvetica, sans-serif" font-size="9.4" font-weight="400" fill="#4B625F">Comprueba: Citas y lista coinciden. Comprueba autores,</text>
<text x="326" y="527.5" font-family="Arial, Helvetica, sans-serif" font-size="9.4" font-weight="400" fill="#4B625F">edición, DOI y claves exportadas.</text>
<rect x="30" y="558" width="552" height="97" rx="7" fill="#E5EFE8"/>
<rect x="42" y="570" width="23" height="23" rx="5" fill="#B77828"/>
<text x="48" y="586" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">7</text>
<text x="74" y="586" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#183D3A">Revisar y mantener la biblioteca</text>
<text x="42" y="608" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="400" fill="#183D3A">Contrasta adjuntos con metadatos: título, autores, DOI, versión y función del anexo. Revisa también enlaces y claves</text>
<text x="42" y="621" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="400" fill="#183D3A">entre Zotero y mis documentos; propone correcciones.</text>
<text x="42" y="639" font-family="Arial, Helvetica, sans-serif" font-size="9.4" font-weight="400" fill="#4B625F">Comprueba: un enlace válido puede llevar al PDF equivocado. Conserva la correspondencia entre claves anteriores y</text>
<text x="42" y="650.5" font-family="Arial, Helvetica, sans-serif" font-size="9.4" font-weight="400" fill="#4B625F">actuales; no decidas solo por el nombre del archivo.</text>
<text x="30" y="676" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="700" fill="#167A71">ANTES DE EMPEZAR</text>
<text x="30" y="692" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="400" fill="#183D3A">La API conecta herramientas con Zotero. Verifica versión, acceso local o web y permisos según la tarea; un chat no accede por sí</text>
<text x="30" y="704" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="400" fill="#183D3A">solo a tu biblioteca.</text>
<text x="30" y="722" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="400" fill="#4B625F">Ensayado en el seminario: consulta, registro y anotaciones por API web. Síntesis y citas requieren revisión; el flujo depende del editor y</text>
<text x="30" y="733.5" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="400" fill="#4B625F">las herramientas disponibles.</text>
<a href="https://seminario-iie.netlify.app/recursos/zotero.html#ficha-de-consulta">
<text x="30" y="754" font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="400" fill="#4B625F">Guía: seminario-iie.netlify.app/recursos/zotero.html</text>
</a>
<text x="30" y="770" font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="400" fill="#4B625F">Propuesta de Miguel · Desarrollo con IA · 10 oct 2026 · v1.3</text>
<text x="548" y="770" font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="400" fill="#4B625F">1 / 1</text>
</svg>