project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - empieza-aqui.qmd
    - preparar-proyecto.qmd
    - sesiones.qmd
    - temas.qmd
    - reproducibilidad.qmd
    - posts/**/*.qmd
    - recursos/**/*.qmd
    - semillero/**/*.qmd
    - exploraciones/**/*.qmd
  resources:
    - img/Modelo de tres capas.svg
    - img/favicon.svg
    - img/seminario-icono.svg
    - recursos/guia-observacion.csv
    - recursos/clima-modelo.R
    - recursos/zotero-ia-ficha.svg
    - recursos/zotero-ia-ficha.pdf
website:
  title: "iie-3t · Seminario"
  favicon: img/favicon.svg
  description: "Una experiencia formativa sobre integridad ecosistémica, redes bayesianas y ciencia reproducible."
  navbar:
    logo: img/seminario-icono.svg
    logo-alt: "Seminario IIE-3T: probabilidad, sociedad y ecosistema"
    background: light
    left:
      - text: Preparar proyecto
        href: preparar-proyecto.qmd
      - text: Empieza aquí
        href: empieza-aqui.qmd
      - text: Sesiones
        href: sesiones.qmd
      - text: Temas
        href: temas.qmd
      - text: Semillero
        href: semillero/index.qmd
      - text: Reproducibilidad
        href: reproducibilidad.qmd
  page-footer:
    left: "iie-3t · Aprender, modelar y documentar"
    right: "Material de trabajo · versión inicial 0.1"
  search: true
lang: es
format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    link-external-newwindow: true
    code-copy: true
    code-fold: false
execute:
  freeze: false
  cache: false
  error: false
  warning: true
