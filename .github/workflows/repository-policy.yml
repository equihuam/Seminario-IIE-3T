name: Revisión del repositorio
on: [push, pull_request]
jobs:
  repository-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_repo.py
      - run: python -m unittest discover -s tests -p test_repo_policy.py -v
      - run: python -m unittest discover -s tests -p test_netlify_pwa.py -v
